<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 1rem;
            height: 100vh;
            background: #f2f2f2;
            font-family: consolas, monospace;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: white;
        }

        header, #main, #sidebar, footer {
            color: white;
            font-weight: bold;
            text-align: center;
            border-radius: 0.5rem;
        }

        header {
            background-color: #1e90ff;
            box-shadow: 0 4px #0077ea;
            padding: 1.4rem 1rem;
            font-size: 1.1rem;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 1.3rem;
        }

        .content {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            flex: 1;
            min-height: 0;
        }

        #main {
            background-color: #3cb371;
            box-shadow: 0 4px #2f8d59;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            min-height: 260px;
        }

        .main-label {
            display: block;
            text-align: left;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-content: flex-start;
            flex: 1;
        }

        .item {
            background-color: #2f8d59;
            box-shadow: 0 4px #226741;
            width: 101px;
            height: 70px;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        #sidebar {
            background-color: #ff6347;
            box-shadow: 0 4px #e02200;
            width: 180px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        footer {
            background-color: #4169e1;
            box-shadow: 0 4px #1d44b8;
            padding: 1.4rem 1rem;
            font-size: 1.1rem;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 1.3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>header</header>

        <div class="content">
            <main id="main">
                <span class="main-label">main</span>
                <div class="grid">
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                </div>
            </main>

            <div id="sidebar">sidebar</div>
        </div>

        <footer>footer</footer>
    </div>
</body>
</html>
